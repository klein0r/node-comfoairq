name: Release

# Publishes to npm when a version tag is pushed (created by `npm version`).
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret, provenance is attached automatically.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1, which ships with Node.js 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm ci

      # `npm test` needs a real device, so only lint before publishing.
      - run: npm run lint

      - name: Publish to npm
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags="$flags --prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" $flags
